name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Copy files to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "index.html,assets/,favicon.ico,favicon-16x16.png,favicon-32x32.png,favicon-48x48.png,apple-touch-icon.png,android-chrome-192x192.png,android-chrome-512x512.png,scripts/deploy-mchugh-au"
          target: "/tmp/mchugh-au-deploy"
          overwrite: true

      - name: Install to web root
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # Without this the step returns the exit code of the LAST command only,
          # which is how a fully-failed deploy reported success on 2026-08-23.
          script_stop: true
          script: sudo /usr/local/bin/deploy-mchugh-au /tmp/mchugh-au-deploy
